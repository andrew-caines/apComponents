name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '22.22.0'

jobs:
  unit:
    name: Unit tests, gates and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:gates
      - run: npm run check:lockfiles
      - name: Generate the contrast report
        run: npm run report:contrast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contrast-report
          path: reports/contrast.md

  generated-artifacts-are-fresh:
    name: Generated artifacts are fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run gen:theme-contract
      - run: npm run gen:theme-css
      - run: npm run gen:motion-css
      - run: npm run gen:fonts
      - run: npm run gen:font-metrics
      - name: Fail if any generated file drifted from its generator
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are stale. Run the gen:* scripts and commit the result."
            exit 1
          fi
      - name: Fail if any generator started emitting a new, untracked file
        run: |
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::A gen:* script emitted file(s) git diff can't see because they are untracked. Commit the new file(s) or fix the generator."
            exit 1
          fi

  consumer:
    name: Consumer build (gate 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix fixtures/consumer install
      - run: npm --prefix fixtures/consumer run typecheck
      - run: npm run test:consumer

  external-consumer:
    name: External consumer (layout ${{ matrix.layout }}, ${{ matrix.mode }})
    # An app outside the checkout, configured with nothing but apComponents(),
    # renders with one React. Layout A: the vendored checkout is not installed;
    # layout B: it has its own node_modules. See
    # docs/superpowers/specs/2026-10-31-single-react-design.md.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: [a, b]
        mode: [build, dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:external -- --layout ${{ matrix.layout }} --mode ${{ matrix.mode }}

  ssr:
    name: SSR and SPA (gates 6 and 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix fixtures/ssr-app install
      - run: npm --prefix fixtures/ssr-app run typecheck
      - run: npm run test:ssr
      - run: npm run test:spa
      - run: npx --prefix fixtures/ssr-app playwright install --with-deps chromium
      - run: npm run test:hydration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: fixtures/ssr-app/playwright-report/

  storybook:
    name: Stories and accessibility (gates 4 and 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix storybook run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:stories
      - name: Build the static Storybook
        run: npm --prefix storybook run build
      - name: Visual regression (gate 9, advisory)
        id: visual
        if: github.event_name == 'pull_request'
        # Advisory (ADR-0014). Baselines are committed by the Visual baselines workflow.
        continue-on-error: true
        run: npm run test:visual
      - name: Summarise gate 9
        if: always() && github.event_name == 'pull_request' && steps.visual.outcome != 'skipped'
        run: npx tsx storybook/visual/summary.ts
      - uses: actions/upload-artifact@v4
        # outcome, not conclusion: continue-on-error makes a failed step conclude 'success'.
        # A skipped visual step (an earlier step failed) leaves nothing to summarise.
        if: always() && github.event_name == 'pull_request' && steps.visual.outcome != 'skipped'
        with:
          name: visual-diffs
          # playwright.config.ts puts both the JSON report and the per-test
          # actual/expected/diff images under storybook/test-results/.
          path: storybook/test-results/
          if-no-files-found: ignore

  size:
    name: Bundle budget (gate 10, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Measure every entry against its budget
        # Advisory (ADR-0014: "warns on regression"). Making it blocking is
        # deleting this line.
        continue-on-error: true
        run: npm run size
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-report
          path: reports/size.md

  showcase:
    name: Showcase SSR smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run showcase:install
      - run: npm --prefix showcase run typecheck
      - run: npx --prefix showcase playwright install --with-deps chromium
      - run: npm run showcase:test
      - run: npm --prefix showcase run test:smoke:dev
