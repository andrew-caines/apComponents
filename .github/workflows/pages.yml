name: Storybook on GitHub Pages

# Publishes the static Storybook from main to https://andrew-caines.github.io/apComponents/.
# The project site lives under /apComponents/, so the build sets STORYBOOK_BASE_PATH (spec §3.5).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22.22.0'

jobs:
  build:
    name: Build the static Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix storybook run build
        env:
          STORYBOOK_BASE_PATH: /apComponents/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook/storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
